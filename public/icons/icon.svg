<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle emerald pulse ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#34d399" stroke-width="6" opacity="0.35"/>
  <circle cx="256" cy="256" r="165" fill="none" stroke="#6ee7b7" stroke-width="2" opacity="0.2"/>

  <!-- Medical Cross with Shadow -->
  <g filter="url(#shadow)">
    <!-- Vertical Bar -->
    <rect x="220" y="116" width="72" height="280" rx="20" fill="#ffffff"/>
    <!-- Horizontal Bar -->
    <rect x="116" y="220" width="280" height="72" rx="20" fill="#ffffff"/>
  </g>

  <!-- Center Golden Stethoscope / Herbal Emblem Accent -->
  <circle cx="256" cy="256" r="28" fill="#f59e0b"/>
  <path d="M256 244 C262 238, 270 244, 270 252 C270 262, 256 270, 256 270 C256 270, 242 262, 242 252 C242 244, 250 238, 256 244 Z" fill="#ffffff"/>
</svg>
